<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #111827;
    }

    .login-page {
      position: relative;
      display: flex;
      align-items: center;
      align-items: safe center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
      background-image: url("https://picx.zhimg.com/v2-617241f0c1a50d9b5240adb01fa9c53e_1440w.jpg?source=172ae18b");
      background-color: #1f2937;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    /* 半透明深色覆盖层，提升文字可读性 */
    .login-page::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 400px;
      padding: 32px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .card__title {
      margin: 0 0 24px;
      font-size: 22px;
      font-weight: 600;
      text-align: center;
    }

    .roles {
      margin: 0 0 20px;
      padding: 0;
      border: 0;
    }

    .roles__legend {
      margin-bottom: 8px;
      padding: 0;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
    }

    .roles__options {
      display: flex;
      gap: 24px;
    }

    .roles__option {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    .field {
      margin-bottom: 20px;
    }

    .field__label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
    }

    .field__input {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      font-size: 15px;
      color: #111827;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #ffffff;
    }

    .field__input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .login-button {
      width: 100%;
      padding: 12px 16px;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background: #2563eb;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease-in-out;
    }

    .login-button:hover {
      background: #1d4ed8;
    }

    .error {
      margin: 12px 0 0;
      font-size: 14px;
      color: #dc2626;
    }

    .error[hidden] {
      display: none;
    }

    .welcome {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      text-align: center;
    }

    /* 小于 480px 的视口：卡片保留 16px 侧边边距 */
    @media (max-width: 480px) {
      .login-page {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body>
  <main class="login-page">
    <section class="card" id="login-card" aria-labelledby="login-title">
      <h1 class="card__title" id="login-title">登录</h1>
      <form id="login-form" novalidate>
        <fieldset class="roles">
          <legend class="roles__legend">角色</legend>
          <div class="roles__options">
            <label class="roles__option">
              <input type="radio" name="role" value="student" checked>
              学生
            </label>
            <label class="roles__option">
              <input type="radio" name="role" value="teacher">
              教师
            </label>
          </div>
        </fieldset>

        <div class="field">
          <label class="field__label" for="username">用户名</label>
          <input class="field__input" type="text" id="username" name="username"
            autocomplete="username">
        </div>

        <div class="field">
          <label class="field__label" for="password">密码</label>
          <input class="field__input" type="password" id="password" name="password"
            autocomplete="current-password">
        </div>

        <button class="login-button" type="submit">登录</button>
        <p class="error" id="login-error" role="alert" hidden>用户名或密码无效</p>
      </form>
    </section>
  </main>

  <script>
    (function () {
      var form = document.getElementById("login-form");
      var card = document.getElementById("login-card");
      var error = document.getElementById("login-error");

      var accounts = {
        student: { username: "student01", password: "123456", roleLabel: "学生" },
        teacher: { username: "teacher01", password: "123456", roleLabel: "教师" }
      };

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        var role = form.querySelector('input[name="role"]:checked').value;
        var username = form.elements.username.value.trim();
        var password = form.elements.password.value;
        var account = accounts[role];

        if (account && username === account.username && password === account.password) {
          var welcome = document.createElement("p");
          welcome.className = "welcome";
          welcome.textContent = "欢迎，" + account.roleLabel + " " + username;
          card.textContent = "";
          card.appendChild(welcome);
        } else {
          error.hidden = false;
        }
      });
    })();
  </script>
</body>
</html>
